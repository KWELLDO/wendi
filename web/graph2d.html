<header>
  <b>解释场 · 2D 图谱</b>
  <span class="sub">底部 = 对话轮次（左→右按发生先后）· 解释自下而上生长 · 卡片挂在它诞生那一轮</span>

  <span class="badge">滚轮缩放 · 拖拽平移 · 双击复位 · 点击节点看详情</span>

  <a class="badge" href="/app/">← 回解释场</a>
  <button id="pngBtn" title="导出当前视图为 PNG；纸色印刷版式，带落款，不随夜版反色">导出图片</button>
  <button id="jsonBtn" title="导出图谱结构 JSON（含解释卡正文与追问；不含对话原文）">导出 json</button>

<div id="main">

    <div class="psec">
      <div class="ptitle">会话</div>
      <div id="meta" class="mgrid"></div>
    </div>
    <div class="psec">
      <div class="ptitle">图例</div>
      <div class="legend">
        <span class="e">●</span> 解释卡&nbsp;&nbsp;<span class="e">◇</span> 对话轮次&nbsp;&nbsp;<span class="e">+N</span> 追问数<br>
        每轮 = 一问一答，卡片长在它诞生那一轮之上<br>

<script>
"use strict";
/* ============ 数据：只读当前会话（与解释场同一 localStorage） ============ */
const SKEY = "explainer-proto-v2";

function loadState(){
  try{
    const d = JSON.parse(localStorage.getItem(SKEY) || "null");
    if(d && d.root) return d;
  }catch(e){}
  return null;
}

/* ============ 布局：自下而上，像树一样生长 ============ */
const LEVEL_H = 122;         // 每层解释的垂直距离（越深越靠上）
const LEAF_W = 178;          // 叶子水平间距（含标签宽度）
const TURN_W = 104;          // 单轮对话的最小水平步进（这一轮没长出卡片时）
const PAD = { l: 70, r: 180, t: 56, b: 54 };

function nodeTime(n){
  if(typeof n.createdAt === "number") return n.createdAt;
  if(Array.isArray(n.messages)){
    const ts = n.messages.map(m => m.at).filter(t => typeof t === "number");
    if(ts.length) return Math.min(...ts);
  }
  return null;
}

/* 主对话切片：一轮 = 一条 user 消息（及其后的 assistant 回答） */
function splitTurns(conv){
  const out = [];
  for(const m of conv.messages || []){
    if(m.role === "user"){
      out.push({ q:m.text || "", a:"", at:typeof m.at === "number" ? m.at : null, loading:false });
    }else{
      if(!out.length) out.push({ q:"", a:"", at:null, loading:false });   // 异常数据：没有提问的回答也占一轮
      const t = out[out.length-1];
      t.a = m.text || "";
      t.loading = !!m.loading;
      if(t.at == null && typeof m.at === "number") t.at = m.at;
    }
  }
  const fb = nodeTime(conv);
  out.forEach(t => { if(t.at == null) t.at = fb == null ? Date.now() : fb; });
  return out;
}

/* 卡片挂在哪一轮：优先用创建时写入的 exp.turn，其次按创建时间落在哪一轮之后 */
function turnOf(card, turns){
  if(typeof card.turn === "number" && card.turn >= 1) return Math.min(Math.round(card.turn), turns.length);
  const t = nodeTime(card);
  if(t == null) return turns.length;
  let k = 1;
  for(let i = 0; i < turns.length; i++) if(turns[i].at <= t) k = i + 1;
  return k;
}

function collect(state){
  const nodes = [], edges = [];
  const push = (item, parent, chain) => {
    item.parent = parent;
    nodes.push(item);
    if(parent){ edges.push({ a:parent, b:item, chain:!!chain }); parent.kids++; }
    return item;
  };

  /* 主对话 = 底部一条轮次链：每轮一个节点，卡片挂在它诞生那一轮之上 */
  function walkConv(n, depth, parent){
    const turns = splitTurns(n);
    if(!turns.length){                        // 空对话：留一个「对话」点（与旧版一致）
      const item = push({ ref:n, id:n.id, kind:"conv", depth, t:nodeTime(n), parent, kids:0, turn:0 }, parent);
      for(const c of n.children || []) walk(c, depth + 1, item);
      return item;
    }
    const items = turns.map((tr, i) => ({ ref:n, id:`${n.id}#t${i+1}`, kind:"turn", turn:i + 1, depth,
                                          t:tr.at, parent:null, kids:0, q:tr.q, a:tr.a, loading:tr.loading }));
    items.forEach((it, i) => push(it, i ? items[i-1] : parent, i > 0));
    for(const c of n.children || []) walk(c, depth + 1, items[turnOf(c, turns) - 1]);
    return items[0];
  }

  function walk(n, depth, parent){
    if(n.kind === "conv") return walkConv(n, depth, parent);
    const item = push({ ref:n, id:n.id, kind:"exp", term:n.term || "", depth,
                        t:nodeTime(n), parent, kids:0 }, parent);
    for(const c of n.children || []) walk(c, depth + 1, item);
    return item;
  }
  walk(state.root, 0, null);

  // 缺时间的节点（老数据的对话根等）：子全有时间取最早 → 父时间 → 全局最早
  const known = nodes.map(n => n.t).filter(t => t != null);
  const fallback = known.length ? Math.min(...known) : Date.now();
  for(let pass = 0; pass < nodes.length; pass++){
    let changed = false;
    for(const n of nodes){
      if(n.t != null) continue;
      const kids = nodes.filter(x => x.parent === n);
      if(kids.length && kids.every(k => k.t != null)){
        n.t = Math.min(...kids.map(k => k.t)); changed = true;
      }else if(n.parent && n.parent.t != null){
        n.t = n.parent.t; changed = true;
      }
    }
    if(!changed) break;
  }
  nodes.forEach(n => { if(n.t == null) n.t = fallback; });
  return { nodes, edges };
}

function layout(nodes, edges){
  const kids = new Map();
  for(const n of nodes){
    if(!kids.has(n.parent)) kids.set(n.parent, []);
    kids.get(n.parent).push(n);          // nodes 顺序=创建顺序 → 同层左→右按时间
  }
  const maxDepth = Math.max(0, ...nodes.map(n => n.depth));
  const plotH = maxDepth * LEVEL_H;
  const H = Math.max(PAD.t + plotH + PAD.b, 320);
  const yAt = d => PAD.t + plotH - d * LEVEL_H + (H - (PAD.t + plotH + PAD.b));  // 根在下，向上生长

  let cursor = PAD.l;
  // 解释子树：叶子按游标横排，父节点居中于子节点之上；返回该子树的水平占位 [lo,hi]
  function place(n){
    n.y = yAt(n.depth);
    const ks = kids.get(n) || [];
    if(!ks.length){
      const lo = cursor;
      cursor += LEAF_W;
      n.x = lo + LEAF_W / 2;
      return [lo, cursor];
    }
    let lo = Infinity, hi = -Infinity;
    for(const k of ks){
      const [a, b] = place(k);
      if(a < lo) lo = a;
      if(b > hi) hi = b;
    }
    n.x = (ks[0].x + ks[ks.length - 1].x) / 2;   // 居中于子节点之上
    return [Math.min(lo, n.x), Math.max(hi, n.x)];
  }

  // 底层 = 对话时间线：轮次按发生先后左→右，各自吃掉一条不小于 TURN_W 的车道
  for(const t of nodes.filter(n => n.depth === 0)){
    let lo = cursor, hi = cursor;
    for(const k of kids.get(t) || []){
      const [a, b] = place(k);
      if(a < lo) lo = a;
      if(b > hi) hi = b;
    }
    const w = Math.max(hi - lo, TURN_W);
    t.y = yAt(0);
    t.x = lo + w / 2;
    cursor = lo + w;
  }
  const W = Math.max(cursor + PAD.r, PAD.l + 320);
  return { W, H,
           tmin: Math.min(...nodes.map(n => n.t)),
           tmax: Math.max(...nodes.map(n => n.t)),
           maxDepth };
}

/* ============ 渲染 ============ */
const svg = document.getElementById("svg");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const trunc = (s, n) => [...s].length > n ? [...s].slice(0, n).join("") + "…" : s;

function fmtTime(t){
  const d = new Date(t), now = new Date();
  const hm = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  return d.toDateString() === now.toDateString() ? hm
       : `${d.getMonth()+1}-${d.getDate()} ${hm}`;
}
function fmtDay(t){
  const d = new Date(t);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

const DEFS = "";  // 渐变已废弃：节点改为纯墨填充（新纸感系统）

let VIEW = null;   // 初始 viewBox（双击复位用）
let DATA = null;
let SEL = null;    // 当前选中的节点 id

function render(){
  const state = loadState();
  const empty = document.getElementById("empty");
  if(!state){
    empty.style.display = "flex";
    document.getElementById("emptyMsg").textContent = "没有找到当前会话数据（localStorage 为空）";
    svg.innerHTML = "";
    document.getElementById("stat").textContent = "无数据";
    document.getElementById("meta").innerHTML = "";
    clearSel();
    return;
  }
  const { nodes, edges } = collect(state);
  DATA = { nodes, edges };
  const exps = nodes.filter(n => n.kind === "exp");
  const turns = nodes.filter(n => n.kind === "turn");
  if(!exps.length && !turns.length){
    empty.style.display = "flex";
    document.getElementById("emptyMsg").textContent = "这个会话还没有解释卡片——去解释场划词生成一张再来";
    svg.innerHTML = "";
    document.getElementById("stat").textContent = "0 张卡";
    document.getElementById("meta").innerHTML = "";
    clearSel();
    return;
  }
  empty.style.display = "none";
  clearSel();

  const L = layout(nodes, edges);
  const followups = exps.reduce((s, n) => s + (n.ref.followups || []).length, 0);
  document.getElementById("stat").textContent =
    `${exps.length} 张解释卡 · ${followups} 条追问 · ${turns.length} 轮对话`;

  // 右侧「会话」元信息
  document.getElementById("meta").innerHTML =
    `<div class="mi"><span>解释卡</span><b>${exps.length}</b></div>` +
    `<div class="mi"><span>追问</span><b>${followups}</b></div>` +
    `<div class="mi"><span>层级</span><b>${L.maxDepth + 1} 层</b></div>` +
    `<div class="mi"><span>对话轮次</span><b>${turns.length}</b></div>` +
    `<div class="mi wide"><span>时间范围</span><b>${fmtDay(L.tmin)} ${fmtTime(L.tmin)} – ${fmtTime(L.tmax)}</b></div>`;

  // —— 展开动画节奏：每层 step 毫秒级联，树再深总时长也压在一秒内 ——
  const step = Math.min(120, 720 / Math.max(1, L.maxDepth));      // 每层间隔
  const edgeDur = Math.max(80, step - 15);                        // 枝干描画时长
  const nodeDelay = (depth, i) => Math.round(depth * step + Math.min(i * 14, 110));

  // 边（父在下 → 子在上，竖向贝塞尔，像枝干向上长；父出现后随即开始描画，到子出现时刚好画完）
  let eg = "";
  edges.forEach((e, i) => {
    const my = (e.a.y + e.b.y) / 2;
    const d = (e.b.depth - 1) * step + 18;
    eg += `<path class="edge${e.chain ? " chain" : ""}" data-a="${e.a.id}" data-b="${e.b.id}" pathLength="100" ` +
          `style="animation-delay:${Math.round(d)}ms;animation-duration:${Math.round(edgeDur)}ms" ` +
          `d="M${e.a.x},${e.a.y} C${e.a.x},${my} ${e.b.x},${my} ${e.b.x},${e.b.y}"/>`;
  });

  // 节点（柔光 + 芯 + 术语标签；从下弹出，按层错峰）
  let nd = "";
  nodes.forEach((n, i) => {
    const delay = `animation-delay:${nodeDelay(n.depth, i)}ms`;
    if(n.kind === "conv" || n.kind === "turn"){
      const turn = n.kind === "turn";
      const cls = "n-conv" + (turn ? " n-turn" : "") + (n.loading ? " ghost" : "");
      nd += `<g class="node ${cls}" data-id="${n.id}" style="${delay}">` +
            `<title>${esc(turn ? (n.q ? trunc(n.q, 80) : "（空提问）") : "对话根")}</title>` +
            `<circle class="halo" cx="${n.x}" cy="${n.y}" r="15"/>` +
            `<circle class="ring" cx="${n.x}" cy="${n.y}" r="10.5"/>` +
            `<rect class="core" x="${n.x - 5}" y="${n.y - 5}" width="10" height="10" rx="2" transform="rotate(45 ${n.x} ${n.y})"/>` +
            `<text class="lab" x="${n.x + 13}" y="${n.y + 4}">${turn ? `第 ${n.turn} 轮` : "对话"}</text></g>`;
      return;
    }
    const fu = (n.ref.followups || []).length;
    const cls = "n-exp" + (n.ref.error ? " err" : (n.ref.loading ? " ghost" : ""));
    nd += `<g class="node ${cls}" data-id="${n.id}" style="${delay}">` +
          `<circle class="halo" cx="${n.x}" cy="${n.y}" r="15"/>` +
          `<circle class="ring" cx="${n.x}" cy="${n.y}" r="10.5"/>` +
          `<circle class="core" cx="${n.x}" cy="${n.y}" r="5.2"/>` +
          `<text class="lab" x="${n.x + 12.5}" y="${n.y + 4}">${esc(trunc(n.term || "(未命名)", 16))}` +
          (fu ? ` <tspan class="fu">+${fu}</tspan>` : "") + `</text></g>`;
  });

  svg.setAttribute("viewBox", `0 0 ${L.W} ${L.H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  VIEW = `0 0 ${L.W} ${L.H}`;
  svg.innerHTML = DEFS + eg + nd;
}

/* ============ 右侧面板 ============ */
const byId = id => DATA && DATA.nodes.find(n => n.id === id);

function sourceQuoteHTML(context, term){
  const text = String(context || "");
  const selected = String(term || "");
  const at = selected ? text.indexOf(selected) : -1;
  if(at < 0) return esc(text || "（没有保存原文语境）");
  return esc(text.slice(0, at)) + `<mark>${esc(selected)}</mark>` + esc(text.slice(at + selected.length));
}

function fallbackNeed(card){
  const q = String(card.question || "").trim();
  if(q){
    if(/为什么|为何|原因|因果/.test(q)) return "你可能在确认这里的原因或因果关系。";
    if(/怎么|如何|怎样|怎么办/.test(q)) return "你可能想弄清这里涉及的机制或做法。";
    if(/区别|不同|是否|是不是|还是/.test(q)) return "你可能在辨析相近概念的边界或判断条件。";
    return `你可能想解决这条疑惑：「${q}」`;
  }
  return `仅凭划词作低把握推测：你可能想确认「${String(card.term || "这个词")}」在这段语境中的具体含义。`;
}

function clearSel(){
  SEL = null;
  svg.querySelectorAll(".node.sel").forEach(g => g.classList.remove("sel"));
  svg.querySelectorAll(".edge.sel").forEach(p => p.classList.remove("sel"));
  const box = document.getElementById("detailBody");
  box.innerHTML = '<div class="hint">点击图中任意节点<br>这里会显示它的全部细节</div>';
}

function selectNode(id){
  SEL = id;
  svg.querySelectorAll(".node.sel").forEach(g => g.classList.remove("sel"));
  svg.querySelectorAll(".edge.sel").forEach(p => p.classList.remove("sel"));
  const n = byId(id);
  if(!n) return;
  const g = svg.querySelector(`.node[data-id="${id}"]`);
  if(g) g.classList.add("sel");
  svg.querySelectorAll(".edge").forEach(p => {
    if(p.dataset.a === id || p.dataset.b === id) p.classList.add("sel");
  });

  const r = n.ref;
  const box = document.getElementById("detailBody");
  if(n.kind === "conv"){
    const msgs = (r.messages || []).filter(m => !m.loading);
    box.innerHTML =
      `<div class="dtitle">对话根</div>` +
      `<div class="dmeta">${fmtDay(n.t)} ${fmtTime(n.t)} · ${msgs.length} 条消息</div>` +
      `<div class="drow">从这里长出 <b>${n.kids}</b> 张解释卡</div>` +
      (msgs.length ? `<div class="ptitle2">最近消息</div>` + msgs.slice(-6).map(m =>
        `<div class="dfu"><div class="dq">${m.role === "user" ? "你" : "AI"}</div>` +
        `<div class="da">${esc(trunc(m.text || "", 220))}</div></div>`).join("") : "");
  }else if(n.kind === "turn"){
    box.innerHTML =
      `<div class="dtitle">第 ${n.turn} 轮对话</div>` +
      `<div class="dmeta">${fmtDay(n.t)} ${fmtTime(n.t)}</div>` +
      `<div class="drow">从这一轮长出 <b>${n.kids}</b> 张解释卡</div>` +
      `<div class="dfu dturn"><div class="dq">你问</div><div class="da">${esc(trunc(n.q, 600)) || "（空）"}</div></div>` +
      `<div class="dfu dturn"><div class="dq">AI 答</div><div class="da">${esc(trunc(n.a, 1500)) || (n.loading ? "生成中…" : "（空）")}</div></div>`;
  }else{
    const fu = r.followups || [];
    const parent = !n.parent ? "—"
                 : n.parent.kind === "exp" ? n.parent.term
                 : n.parent.kind === "turn" ? `第 ${n.parent.turn} 轮`
                 : "对话根";
    box.innerHTML =
      `<div class="dtitle">${esc(n.term || "(未命名)")}</div>` +
      `<div class="dmeta">${fmtDay(n.t)} ${fmtTime(n.t)} · 第 ${n.depth} 层` +
      (r.style ? ` · ${esc(r.style)}` : "") +
      (typeof r.text === "string" && r.text ? ` · ${r.text.length} 字` : "") + `</div>` +
      `<div class="drow">图谱位置：<b>${esc(parent)}</b></div>` +
      `<div class="drow">长出 <b>${n.kids}</b> 个子解释 · <b>${fu.length}</b> 条追问</div>` +
      `<div class="ptitle2">来源</div>` +
      `<div class="sourcebox">` +
        `<div class="sourcefield"><div class="source-label">你划出的原文</div>` +
          `<div class="source-term">${esc(r.term || "（未保存划词）")}</div>` +
          `<div class="source-label context-label">所在语境</div>` +
          `<div class="source-quote">${sourceQuoteHTML(r.context, r.term)}</div></div>` +
        `<div class="sourcefield"><div class="source-label">语境说明</div>` +
          `<div class="source-note${r.contextReading ? "" : " source-missing"}">${esc(r.contextReading || "尚未保存语境说明；重新解释后可生成。")}</div></div>` +
        (r.question ? `<div class="sourcefield"><div class="source-label">你补充的疑惑</div>` +
          `<div class="source-note">${esc(r.question)}</div></div>` : "") +
        `<div class="sourcefield"><div class="source-label">可能的卡点 · ${r.likelyNeed ? (r.question ? "AI 推测（根据你的疑惑）" : "AI 推测（低把握）") : (r.question ? "系统弱推测（根据疑惑归纳）" : "系统弱推测（仅据划词）")}</div>` +
          `<div class="source-guess">${esc(r.likelyNeed || fallbackNeed(r))}</div></div>` +
      `</div>` +
      `<div class="ptitle2">正文</div>` +
      `<div class="dtext">${esc(r.text || (r.loading ? "生成中…" : (r.error ? "失败：" + r.error : "（暂无正文）")))}</div>` +
      (fu.length ? `<div class="ptitle2">追问（${fu.length}）</div>` + fu.map(f =>
        `<div class="dfu"><div class="dq">${esc(f.q)}</div>` +
        `<div class="da">${esc(trunc(f.a || "…", 220))}</div></div>`).join("") : "");
  }
  box.scrollTop = 0;
  document.getElementById("panel").classList.add("open");   // 窄屏自动弹出抽屉
}

/* ============ 交互：点击选中 / 平移缩放 / 双击复位 ============ */
let downPos = null;
svg.addEventListener("mousedown", e => {
  downPos = { x: e.clientX, y: e.clientY };
});
svg.addEventListener("click", e => {
  if(downPos && (Math.abs(e.clientX - downPos.x) > 4 || Math.abs(e.clientY - downPos.y) > 4)) return; // 拖拽不算点击
  const g = e.target.closest("g[data-id]");
  if(g && DATA){ selectNode(g.dataset.id); }
  else { clearSel(); }
});
document.getElementById("rebtn").onclick = render;
document.getElementById("panelBtn").onclick = () =>
  document.getElementById("panel").classList.toggle("open");
document.getElementById("panelClose").onclick = () =>
  document.getElementById("panel").classList.remove("open");

// viewBox 平移缩放
function parseVB(){
  return (svg.getAttribute("viewBox") || "0 0 800 600").split(/\s+/).map(Number);
}
function setVB(v){ svg.setAttribute("viewBox", v.join(" ")); }

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const v = parseVB(), k = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  const r = svg.getBoundingClientRect();
  const px = v[0] + (e.clientX - r.left) / r.width * v[2];
  const py = v[1] + (e.clientY - r.top) / r.height * v[3];
  const nv = [px - (px - v[0]) * k, py - (py - v[1]) * k, v[2] * k, v[3] * k];
  const cap = (VIEW || "0 0 800 600").split(/\s+/).map(Number);
  if(nv[2] > cap[2] * 20 || nv[2] < cap[2] / 50) return;   // 缩放边界
  setVB(nv);
}, { passive:false });

let drag = null;
svg.addEventListener("mousedown", e => {
  const v = parseVB();
  drag = { x:e.clientX, y:e.clientY, v };
  svg.classList.add("drag");
});
window.addEventListener("mousemove", e => {
  if(!drag) return;
  const r = svg.getBoundingClientRect();
  const dx = (e.clientX - drag.x) / r.width * drag.v[2];
  const dy = (e.clientY - drag.y) / r.height * drag.v[3];
  setVB([drag.v[0] - dx, drag.v[1] - dy, drag.v[2], drag.v[3]]);
});
window.addEventListener("mouseup", () => { drag = null; svg.classList.remove("drag"); });
svg.addEventListener("dblclick", () => { if(VIEW) setVB(VIEW.split(/\s+/).map(Number)); });

/* ============ 导出：图片（自包含 SVG → PNG）/ JSON ============ */
const EX_SANS = `-apple-system,"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif`;
const EX_SERIF = `"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",Georgia,serif`;

// 导出图是印刷物（照 ADR 0001：分享卡不随夜版反色）→ 颜色写死为亮色纸墨，
// 并强制 animation:none：画面上 .edge 的入场描画靠 stroke-dashoffset，
// 静态图片里没有动画会残留 dashoffset:100 → 枝干整条不可见，必须在这里归零。
const EX_CSS = `*{animation:none!important;transition:none!important}
  .edge{stroke:rgba(21,19,15,.28);stroke-width:1.3;fill:none}
  .edge.hot,.edge.sel{stroke:rgba(165,40,28,.85);stroke-width:1.8}
  .halo{fill:#15130f;opacity:.07}
  .core{fill:#15130f;stroke:none}
  .ring{display:none}
  .n-exp.ghost .core{fill:none;stroke:#8a8478;stroke-dasharray:3 3}
  .n-exp.ghost .halo{opacity:.08}
  .n-exp.err .core{fill:none;stroke:#8f2317}
  .n-exp.err .halo{fill:#8f2317;opacity:.18}
  .n-conv .core{fill:none;stroke:#8a8478;stroke-width:1.2}
  .lab{font:500 12px ${EX_SANS};fill:#15130f;paint-order:stroke;stroke:#fbf8f1;
       stroke-width:3.2px;stroke-linejoin:round;letter-spacing:.01em}
  .n-conv .lab{fill:#8a8478;font-weight:400}
  .fu{fill:#a5281c;font-size:10.5px;font-weight:600}`;

const FOOT_H = 68;      // 落款带高度（视图外附加，不占 viewBox）
const pad2 = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const stamp = () => { const d = new Date();
  return `${today()}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`; };  // 文件名：连导多张也不互相覆盖
const escXml = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));

/* 当前视图 + 落款带 → 自包含 SVG（不依赖页面 CSS，任何地方打开都同一样子） */
function buildExportSvg(){
  const v = parseVB();
  const src = svg.cloneNode(true);
  src.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));   // 分享图不带本机选中态
  src.querySelectorAll("[style]").forEach(n => n.removeAttribute("style")); // 去掉入场动画 delay
  const H = v[3] + FOOT_H, fy = v[1] + v[3];
  const exps = DATA.nodes.filter(n => n.kind === "exp" && !n.ref.loading);
  const fu = exps.reduce((s, n) => s + (n.ref.followups || []).length, 0);
  const depth = Math.max(0, ...DATA.nodes.map(n => n.depth)) + 1;
  const l1 = `${exps.length} 张解释卡 · ${fu} 条追问 · ${depth} 层`;
  const l2 = `know.kwelldo.cn · ${today()}`;
  const SUB = "碰到不懂的词，就划它";
  const IN = 28, fx = v[0] + IN, fr = v[0] + v[2] - IN;
  const mctx = document.createElement("canvas").getContext("2d");
  const wOf = (font, s) => { mctx.font = font; return mctx.measureText(s).width; };
  const F_T = `600 15px ${EX_SERIF}`, F_S = `11px ${EX_SANS}`;
  const avail = Math.max(0, v[2] - IN * 2);      // 视图被缩窄（放大后导出）时落款要改版，别让两栏叠字
  const w = { t: wOf(F_T, "问底 WenDi"), sub: wOf(F_S, SUB), l1: wOf(F_S, l1), l2: wOf(F_S, l2) };
  const parts = [];
  const put = (x, y, font, fill, anchor, s) => parts.push(
    `<text x="${x}" y="${y}" text-anchor="${anchor}" style='font:${font}' fill="${fill}">${escXml(s)}</text>`);
  if (w.t + 24 + w.l1 <= avail && w.sub + 24 + w.l2 <= avail){   // 宽：两栏两行
    put(fx, fy + 28, F_T, "#15130f", "start", "问底 WenDi");
    put(fr, fy + 28, F_S, "#4a463e", "end", l1);
    put(fx, fy + 48, F_S, "#8a8478", "start", SUB);
    put(fr, fy + 48, F_S, "#8a8478", "end", l2);
  } else if (w.t + 24 + w.l2 <= avail){                          // 中：统计移到左下行，网址与牌子同行
    put(fx, fy + 28, F_T, "#15130f", "start", "问底 WenDi");
    put(fr, fy + 28, F_S, "#8a8478", "end", l2);
    put(fx, fy + 48, F_S, "#4a463e", "start", l1);
  } else {                                                       // 窄：单列，只留牌子 + 网址（水印优先）
    put(fx, fy + 28, F_T, "#15130f", "start", "问底 WenDi");
    put(fx, fy + 48, F_S, "#8a8478", "start", l2);
  }
  const foot = `<rect x="${v[0]}" y="${fy}" width="${v[2]}" height="${FOOT_H}" fill="#fbf8f1"/>` +
    `<path d="M${v[0]},${fy + .5}H${v[0] + v[2]}" stroke="#d8d2c4" fill="none"/>` + parts.join("");
  const text = `<svg xmlns="http://www.w3.org/2000/svg" width="${v[2]}" height="${H}" ` +
    `viewBox="${v[0]} ${v[1]} ${v[2]} ${H}"><style>${EX_CSS}</style>` +
    `<rect x="${v[0]}" y="${v[1]}" width="${v[2]}" height="${v[3]}" fill="#fbf8f1"/>` +
    src.innerHTML + foot + `</svg>`;
  return { text, W: v[2], H };
}

function svgToPng(text, W, H, S, cb){
  const url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml;charset=utf-8" }));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(W * S)); cv.height = Math.max(1, Math.round(H * S));
    const g = cv.getContext("2d");
    g.fillStyle = "#fbf8f1"; g.fillRect(0, 0, cv.width, cv.height);
    g.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(b => cb(b, cv.width, cv.height), "image/png");
  };
  img.onerror = () => { URL.revokeObjectURL(url); cb(null, 0, 0); };
  img.src = url;
}

function dl(blob, name){
  const a = document.createElement("a"), href = URL.createObjectURL(blob);
  a.href = href; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(href), 10000);
}

/* 图谱 JSON：结构 + 解释卡内容（对话原文不导出——那是另一份数据，见解释场「导出 json」） */
function graphJson(){
  if(!DATA || !DATA.nodes.length) return null;
  const nodes = DATA.nodes.filter(n => !n.ref.loading).map(n => {
    const o = { id: n.id, kind: n.kind, term: n.term || null, depth: n.depth,
                parent: n.parent ? n.parent.id : null,
                t: n.t == null ? null : new Date(n.t).toISOString() };
    const r = n.ref;
    if(n.kind === "exp"){
      if(r.style) o.style = r.style;
      o.chars = typeof r.text === "string" ? r.text.length : 0;
      o.text = typeof r.text === "string" ? r.text : "";
      if(r.context) o.context = r.context;
      if((r.followups || []).length) o.followups = r.followups.map(f => ({ q: f.q, a: f.a || "" }));
      if(r.error) o.error = String(r.error);
    }
    return o;
  });
  const ids = new Set(nodes.map(n => n.id));
  const exps = nodes.filter(n => n.kind === "exp");
  return { v: 1, app: "问底 WenDi", kind: "graph",
    note: "图谱结构 + 解释卡内容（正文/语境/追问）；对话原文不在此文件",
    exported: new Date().toISOString(),
    stats: { cards: exps.length,
             followups: exps.reduce((s, n) => s + (n.followups || []).length, 0),
             depth: Math.max(0, ...nodes.map(n => n.depth)) + 1,
             conv: nodes.filter(n => n.kind === "conv").length },
    nodes,
    edges: DATA.edges.filter(e => ids.has(e.a.id) && ids.has(e.b.id)).map(e => [e.a.id, e.b.id]) };
}

const pngBtn = document.getElementById("pngBtn"), jsonBtn = document.getElementById("jsonBtn");
pngBtn.onclick = () => {
  if(!DATA || !DATA.nodes.length){ wdiag.toast("没有可导出的图谱数据", { kind: "warn" }); return; }
  const label = pngBtn.textContent;
  pngBtn.disabled = true; pngBtn.textContent = "导出中…";
  const { text, W, H } = buildExportSvg();
  const S = Math.max(.35, Math.min(2, 3200 / Math.max(W, H)));   // 2 倍清晰，长边封顶 3200px
  svgToPng(text, W, H, S, (blob, w, h) => {
    pngBtn.disabled = false; pngBtn.textContent = label;
    if(!blob){ wdiag.toast("导出失败：图片渲染出错", { kind: "err" }); return; }
    dl(blob, `问底-图谱-${stamp()}.png`);
  });
};
jsonBtn.onclick = () => {
  const p = graphJson();
  if(!p){ wdiag.toast("没有可导出的图谱数据", { kind: "warn" }); return; }
  dl(new Blob([JSON.stringify(p, null, 2)], { type: "application/json" }), `问底-图谱-${stamp()}.json`);
};

window.addEventListener("storage", e => { if(e.key === SKEY) render(); });  // 解释场改数据时本页自动刷新
render();
</script>
