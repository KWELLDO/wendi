<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消息 · 问底 WenDi</title>
<meta name="description" content="查看问底开发 Agent 需要向你确认的问题。">
<link rel="stylesheet" href="/site.css">
<style>
  .mbadge{display:inline-block;border:1px solid var(--hairline);color:var(--ink-3);
          font:11px var(--mono);padding:0 6px;margin-left:8px}
  .mbody{font-family:var(--serif);font-size:16px;line-height:1.8;white-space:pre-wrap;margin:10px 0 12px}
  .mcard.unread{border-left:3px solid var(--accent)}
  .mempty{color:var(--ink-3);font-family:var(--serif)}
</style>
</head>
<body>
<header class="site">
  <a class="brand" href="/">问底<span>WenDi</span></a>
  <nav>
    <a href="/about.html">关于</a>
    <a href="/feedback.html">反馈</a>
    <a href="/messages.html" class="on">消息</a>
    <a href="/privacy.html">隐私</a>
    <a href="/terms.html">条款</a>
    <a class="go" href="/">回到工作台</a>
  </nav>
</header>
<main>
  <h1>消息</h1>
  <p class="lede">这里显示开发 Agent 需要向你确认的问题。刷新页面查看最新消息；这里不承诺处理时间或修复结果。</p>

  <div id="mstate" class="box warn hidden"></div>
  <div class="row" style="margin:16px 0">
    <button id="refreshBtn">刷新</button>
    <button id="readAllBtn" class="ghost">全部标为已读</button>
  </div>
  <div id="mlist"></div>
</main>
<footer class="site">
  <div class="fnav">
    <a href="/">工作台</a>
    <a href="/about.html">关于 wendi</a>
    <a href="/feedback.html">反馈</a>
    <a href="/messages.html">消息</a>
    <a href="/privacy.html">隐私政策</a>
    <a href="/terms.html">服务条款</a>
  </div>
  <div>问底 WenDi · 递归解释器 · AGPL-3.0 开源</div>
</footer>
<script>
function $(s){ return document.querySelector(s); }
function stateBox(text, warn){
  var el = $("#mstate");
  if (!text) { el.classList.add("hidden"); el.textContent = ""; return; }
  el.classList.remove("hidden");
  el.className = "box " + (warn ? "warn" : "ok");
  el.textContent = text;
}
function token(){ return localStorage.getItem("wendi-token") || ""; }
function headers(){
  var h = { "Content-Type": "application/json" };
  var t = token();
  if (t) h["Authorization"] = "Bearer " + t;
  return h;
}
function fmtTime(s){
  if (!s) return "";
  return String(s).replace("T", " ").slice(0, 16);
}
function newEl(tag, cls, text){
  var el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text != null) el.textContent = text;
  return el;
}
function render(items){
  var list = $("#mlist");
  list.innerHTML = "";
  if (!items.length) {
    list.appendChild(newEl("p", "mempty", "还没有消息。"));
    return;
  }
  items.forEach(function(m){
    var card = newEl("div", "card mcard" + (m.read_at ? "" : " unread"));
    var meta = newEl("div", "hint");
    meta.appendChild(document.createTextNode(fmtTime(m.created_at) + " · " + (m.source === "agent" ? "开发 Agent" : "站长")));
    if (m.feedback_id) meta.appendChild(document.createTextNode(" · 反馈 #" + m.feedback_id));
    if (!m.read_at) meta.appendChild(newEl("span", "mbadge", "未读"));
    card.appendChild(meta);
    card.appendChild(newEl("div", "mbody", m.body));
    if (!m.read_at) {
      var btn = newEl("button", "ghost", "标为已读");
      btn.onclick = function(){ markRead([m.id]); };
      card.appendChild(btn);
    }
    list.appendChild(card);
  });
}
async function api(path, method, body){
  var opts = { method: method || "GET", headers: headers() };
  if (body !== undefined) opts.body = JSON.stringify(body);
  var r = await fetch(path, opts);
  var d = {};
  try { d = await r.json(); } catch(e){}
  return { ok: r.ok, status: r.status, data: d };
}
async function load(){
  if (!token()) {
    stateBox("请先在工作台登录，再回来查看消息。", true);
    $("#mlist").innerHTML = "";
    return;
  }
  stateBox("");
  var r = await api("/api/messages?limit=100");
  if (r.status === 401) {
    localStorage.removeItem("wendi-token");
    stateBox("登录状态已失效，请重新登录。", true);
    return;
  }
  if (!r.ok) {
    stateBox("加载失败：" + (r.data.error || ("HTTP " + r.status)), true);
    return;
  }
  render(r.data.items || []);
  if (r.data.unread) stateBox("有 " + r.data.unread + " 条未读消息。", false);
}
async function markRead(ids){
  var r = await api("/api/messages/read", "POST", { ids: ids });
  if (!r.ok) { stateBox("标记失败：" + (r.data.error || ""), true); return; }
  await load();
}
$("#refreshBtn").onclick = load;
$("#readAllBtn").onclick = async function(){
  if (!token()) return;
  var r = await api("/api/messages/read", "POST", { all: true });
  if (!r.ok) { stateBox("标记失败：" + (r.data.error || ""), true); return; }
  await load();
};
load();
</script>
</body>
</html>
